<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UselessPet — README cover</title>
<link rel="icon" href="data:,">
<style>
* { box-sizing: border-box; }
html,body { margin: 0; width: 1200px; height: 680px; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; background: #f8f3e9; color: #483c32; }
.cover { position: relative; width: 1200px; height: 680px; overflow: hidden; background: radial-gradient(ellipse at 75% 45%, #fffdf5 0, #f8f3e9 65%); }
.eyebrow { position: absolute; top: 42px; left: 58px; font-size: 15px; letter-spacing: 2.6px; font-weight: 650; color: #827661; }
h1 { margin: 0; position: absolute; top: 88px; left: 54px; font-size: 62px; line-height: 1.08; letter-spacing: -3px; font-weight: 720; }
.note { position: absolute; top: 127px; right: 60px; font-size: 20px; line-height: 1.6; color: #8a7c68; text-align: right; }
.stage { position: absolute; left: 35px; right: 35px; bottom: 35px; height: 410px; display: grid; grid-template-columns: repeat(4, 1fr); }
.friend { position: relative; }
.friend::before { content: ""; position: absolute; width: 200px; height: 64px; border-radius: 50%; background: #e8dfce; opacity: .7; bottom: 38px; left: 50%; transform: translateX(-50%); }
.friend img { position: absolute; width: 440px; height: 440px; max-width: none; left: 50%; transform: translateX(-50%); bottom: 24px; object-fit: contain; }
.friend:nth-child(1) img { width: 490px; height: 490px; bottom: -2px; }
.friend:nth-child(3) img { width: 460px; height: 460px; bottom: 3px; }
.friend:nth-child(4) img { width: 450px; height: 450px; bottom: 6px; }
.name { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font-size: 18px; letter-spacing: 1px; font-weight: 600; color: #82735f; }
.spark { position: absolute; color: #bb9b62; font-size: 31px; font-weight: 300; }
.s1 { left: 310px; top: 287px; transform: rotate(12deg); }
.s2 { right: 51px; top: 309px; font-size: 22px; }
</style>
</head>
<body>
<main class="cover">
<div class="eyebrow">UselessPet / DESKTOP COMPANIONS</div>

<div class="friend"><img src="lumi.png" alt="Lumi the bunny"><span class="name">Lumi</span></div>
</div>
</main>
</body>
