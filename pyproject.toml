[project]
name = "uselesspet"
version = "0.1.0"
description = "Completely useless. Surprisingly good company. A quiet desktop companion for macOS."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "larrylabs"}]
dependencies = ["websockets>=15,<17"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/larrylabs/UselessPet"
Issues = "https://github.com/larrylabs/UselessPet/issues"

[project.scripts]
uselesspet = "uselesspet.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/uselesspet"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<0.16"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
